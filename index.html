<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foodtruck &amp; Catering Planer</title>
<style>
:root {
  color-scheme: light;
  --orange: #e8622c;
  --dark: #22262b;
  --bg: #f7f5f2;
  --border: #ddd6cc;
  --green: #2f7d4f;
  --red: #b23a3a;
}
* { box-sizing: border-box; }
html, body {
  background: var(--bg);
  color: var(--dark);
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.topbar {
  background: var(--dark);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  flex-wrap: wrap;
  gap: 8px;
}
.topbar .brand { color: #fff; font-weight: 700; font-size: 1.05em; }
.topbar nav a, .topbar nav button {
  color: #f1efe9;
  text-decoration: none;
  margin-left: 12px;
  font-size: 0.92em;
  background: transparent;
  border: 1px solid #454b52;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-family: inherit;
}
.topbar nav a:hover, .topbar nav button:hover { border-color: var(--orange); color: var(--orange); }
.container { max-width: 1100px; margin: 0 auto; padding: 22px; }
h1, h2, h3 { color: var(--dark); }
a { color: var(--orange); cursor: pointer; }
.flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
.flash-success { background: #e4f3e9; color: var(--green); border: 1px solid var(--green); }
.flash-error { background: #fbe9e7; color: var(--red); border: 1px solid var(--red); }
.card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.card-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.78em; font-weight: 600; background: #eee; color: #555; }
.badge-foodtruck { background: #fde3d1; color: var(--orange); }
.badge-buffet { background: #dcecf7; color: #2b6ca3; }
.badge-live_cooking { background: #eadcf7; color: #7443ab; }
.badge-review { background: #fbe9e7; color: var(--red); }
.badge-ok { background: #e4f3e9; color: var(--green); }
table { width: 100%; border-collapse: collapse; margin: 10px 0; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.92em; }
th { background: #efeae2; }
.btn { display: inline-block; background: var(--orange); color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.92em; font-family: inherit; }
.btn:hover { background: #cf4f1e; }
.btn-secondary { background: #6c7480; }
.btn-secondary:hover { background: #565d67; }
.btn-danger { background: var(--red); }
.btn-small { padding: 5px 10px; font-size: 0.82em; }
form .field { margin-bottom: 12px; }
form label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9em; }
input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.92em; font-family: inherit; background: #fff; color: var(--dark); }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.row4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .row3, .row4, .dish-row-grid, .ing-row-grid { grid-template-columns: 1fr !important; } }
.dish-row, .ing-row { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #fbfaf8; }
.dish-row-grid { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 0.8fr auto; gap: 8px; align-items: end; }
.ing-row-grid { display: grid; grid-template-columns: 1.8fr 0.7fr 0.7fr 1.1fr 0.9fr 0.9fr 0.9fr 1fr auto; gap: 6px; align-items: end; }
.remove-btn { background: transparent; border: none; color: var(--red); cursor: pointer; font-size: 1.05em; }
.variant-group-block { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.muted { color: #888; font-size: 0.86em; }
.warning-box { background: #fff4e0; border: 1px solid #e8b23c; border-radius: 8px; padding: 10px 14px; margin: 12px 0; color: #7a5a10; font-size: 0.92em; }
.field-inline { display:flex; align-items:center; gap:8px; margin-top:20px; }
.field-inline input { width:auto; }
.print-only-value { display: none; }
.ordered-heading { background: #cfe9d8 !important; padding: 3px 9px; border-radius: 6px; }
li.ordered-heading { display: block; list-style: none; margin-bottom: 4px; }
.ordered-check { display: inline-flex; align-items: center; margin-right: 6px; vertical-align: middle; }
.ordered-check input { width: auto; margin: 0; }
.hub-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .hub-cards { grid-template-columns: 1fr; } }
@media print {
  .no-print { display: none !important; }
  .container { max-width: 100%; padding: 0; }
  body { background: #fff; }
  .card { border: none; }
  .no-print-input input { display: none !important; }
  .print-only-value { display: inline !important; }
}
</style>
</head>

<script>
// =========================================================================
// Datenhaltung: Firebase Realtime Database – gemeinsame, geteilte Datenbasis
// für alle Mitarbeiter (Änderungen werden live an alle anderen offenen
// Fenster übertragen). Solange die Daten noch nicht vom Server geladen
// wurden, sind die Caches unten "null" und die App zeigt "Lädt...".
// =========================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC-Mi2WeHy9GRMFtCyRRlIP369JtwY1cqo",
  authDomain: "catering-planer.firebaseapp.com",
  databaseURL: "https://catering-planer-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "catering-planer",
  storageBucket: "catering-planer.firebasestorage.app",
  messagingSenderId: "962019898099",
  appId: "1:962019898099:web:4651f30bf4e2028544bd86"
};

let _recipesCache = null; // null = noch nicht geladen
let _eventsCache = null;
let _seedAttempted = false;
let _fbDb = null;

function objToArray(obj) {
  if (!obj) return [];
  return Object.keys(obj).map(k => obj[k]);
}
function arrayToObj(arr) {
  const obj = {};
  (arr || []).forEach(item => { if (item && item.id) obj[item.id] = item; });
  return obj;
}

function initFirebase() {
  if (typeof firebase === 'undefined') {
    // Firebase-SDK konnte nicht geladen werden (z.B. weil diese Seite in einer
    // Vorschau ohne Internetzugriff läuft). App bleibt dann im Ladezustand.
    document.getElementById('app').innerHTML =
      '<div class="warning-box">Die gemeinsame Datenbank (Firebase) konnte nicht geladen werden. ' +
      'Bitte diese Seite über den echten Link (z.B. GitHub Pages) mit Internetzugriff öffnen, ' +
      'nicht über die Cowork-Vorschau.</div>';
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  _fbDb = firebase.database();

  _fbDb.ref('recipes').on('value', snap => {
    const val = snap.val();
    if (val === null && !_seedAttempted) {
      _seedAttempted = true;
      _fbDb.ref('recipes').set(arrayToObj(loadSeedRecipes()));
      return; // dieser Listener wird durch den .set() gleich erneut ausgelöst
    }
    _recipesCache = objToArray(val);
    safeRoute();
  });

  _fbDb.ref('events').on('value', snap => {
    _eventsCache = objToArray(snap.val());
    safeRoute();
  });
}

// Verhindert, dass ein Live-Update von einem anderen Mitarbeiter mitten in der Eingabe
// (neues Event/Rezept anlegen oder bearbeiten) das gerade offene Formular überschreibt.
function isEditingRoute() {
  const h = (location.hash.slice(1) || '/').split('?')[0];
  return h === '/events/new' || /^\/events\/[^/]+\/edit$/.test(h) ||
         h === '/recipes/new' || /^\/recipes\/[^/]+\/edit$/.test(h);
}
let _firstRenderDone = false;
function safeRoute() {
  if (_firstRenderDone && isEditingRoute()) return;
  _firstRenderDone = true;
  route();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return null;
  const r = Math.round(n * 1000) / 1000;
  return r;
}

const SERVICE_TYPE_LABELS = { foodtruck: 'Foodtruck', buffet: 'Buffet', live_cooking: 'Live Cooking' };

function loadSeedRecipes() {
  const el = document.getElementById('seed-data');
  const raw = JSON.parse(el.textContent);
  return raw.recipes.map(r => ({
    id: uid(),
    name: r.name,
    description: r.description || '',
    defaultServiceType: r.default_service_type || '',
    needsReview: !!r.needs_review,
    ingredients: (r.ingredients || []).map(ing => ({
      id: uid(),
      name: ing.name,
      qtyPerPortion: (ing.qty_per_portion === undefined) ? null : ing.qty_per_portion,
      unit: ing.unit || '',
      allergens: (ing.allergens || []).join(', '),
      supplier: ing.supplier || '',
      container: ing.container || '',
      tool: ing.tool || '',
      variantGroup: ing.variant_group || ''
    }))
  }));
}

function getRecipes() { return _recipesCache || []; }
function saveRecipes(list) {
  _recipesCache = list; // optimistisch sofort lokal übernehmen, damit die UI ohne Wartezeit reagiert
  if (_fbDb) _fbDb.ref('recipes').set(arrayToObj(list));
}
function getEvents() { return _eventsCache || []; }
function saveEvents(list) {
  _eventsCache = list;
  if (_fbDb) _fbDb.ref('events').set(arrayToObj(list));
}
function getRecipeById(id) { return getRecipes().find(r => r.id === id); }
function getEventById(id) { return getEvents().find(e => e.id === id); }

function eventGuestTotal(ev) {
  return (ev.fleischCount||0) + (ev.vegetarischCount||0) + (ev.veganCount||0) + (ev.sonstigeCount||0);
}

// Liefert {Gruppenname: [Zutatname, ...]} für alle Zutaten eines Rezepts, die eine Variantengruppe haben
// (z.B. "Protein": ["Pulled Pork", "Pulled Turkey", "Pulled Jackfruit"])
function getVariantGroups(recipe) {
  const groups = {};
  (recipe ? recipe.ingredients : []).forEach(ing => {
    const g = (ing.variantGroup || '').trim();
    if (!g) return;
    groups[g] = groups[g] || [];
    if (!groups[g].includes(ing.name)) groups[g].push(ing.name);
  });
  return groups;
}

// Wie viele Portionen gelten für eine bestimmte Zutat innerhalb eines Dish?
// Zutaten OHNE Variantengruppe: die volle Portionenzahl des Gerichts.
// Zutaten MIT Variantengruppe: der eingetragene Anteil aus dish.variantSplits, falls vorhanden,
// sonst (noch nicht ausgefüllt) fallback auf die volle Portionenzahl.
function getPortionsForIngredient(ing, dish) {
  const group = (ing.variantGroup || '').trim();
  if (!group) return dish.portions || 0;
  const split = dish.variantSplits && dish.variantSplits[group] ? dish.variantSplits[group][ing.name] : undefined;
  if (split === undefined || split === null || split === '') return dish.portions || 0;
  return Number(split) || 0;
}

// Effektive Menge/Portion einer Zutat für ein bestimmtes Gericht: ein pro-Event-Override
// (dish.ingredientOverrides) hat immer Vorrang vor dem Rezept-Standardwert.
function getEffectiveQtyPerPortion(ing, dish) {
  if (dish.ingredientOverrides && Object.prototype.hasOwnProperty.call(dish.ingredientOverrides, ing.name)) {
    const v = dish.ingredientOverrides[ing.name];
    return (v === null || v === undefined || v === '') ? null : Number(v);
  }
  return (ing.qtyPerPortion === null || ing.qtyPerPortion === undefined || ing.qtyPerPortion === '') ? null : Number(ing.qtyPerPortion);
}

// Skalierte Zutaten für ein einzelnes Gericht (dish) berechnen
function computeScaledIngredients(dish) {
  const recipe = getRecipeById(dish.recipeId);
  if (!recipe) return { dish, recipe: null, ingredients: [] };
  const ingredients = recipe.ingredients.map(ing => {
    const qty = getEffectiveQtyPerPortion(ing, dish);
    const isOverridden = dish.ingredientOverrides && Object.prototype.hasOwnProperty.call(dish.ingredientOverrides, ing.name);
    const portions = getPortionsForIngredient(ing, dish);
    const totalQty = (qty === null) ? null : fmtNum(qty * portions);
    return { name: ing.name, qtyPerPortion: qty, totalQty, unit: ing.unit, allergens: ing.allergens, supplier: ing.supplier, container: ing.container, tool: ing.tool, variantGroup: ing.variantGroup, portionsUsed: portions, isOverridden };
  });
  return { dish, recipe, ingredients };
}

// Bestellliste über mehrere Events aggregieren. recipeIdFilter (optional): nur Zutaten
// von Gerichten mit diesem Rezept berücksichtigen (für die "nach Rezept"-Bestellliste).
function aggregateOrderList(eventIds, recipeIdFilter) {
  const totals = new Map(); // key "name||unit" -> qty
  const unresolved = [];
  eventIds.forEach(eid => {
    const ev = getEventById(eid);
    if (!ev) return;
    (ev.dishes||[]).forEach(dish => {
      if (recipeIdFilter && dish.recipeId !== recipeIdFilter) return;
      const recipe = getRecipeById(dish.recipeId);
      if (!recipe) return;
      recipe.ingredients.forEach(ing => {
        const qty = getEffectiveQtyPerPortion(ing, dish);
        if (qty === null) {
          unresolved.push({ name: ing.name, recipe: recipe.name, unit: ing.unit });
          return;
        }
        const key = ing.name + '||' + (ing.unit || '');
        const add = qty * getPortionsForIngredient(ing, dish);
        totals.set(key, (totals.get(key) || 0) + add);
      });
    });
  });
  const rows = Array.from(totals.entries()).map(([key, qty]) => {
    const [name, unit] = key.split('||');
    return { name, unit, qty: fmtNum(qty) };
  }).sort((a, b) => a.name.localeCompare(b.name, 'de'));
  return { rows, unresolved };
}

// Allergene über mehrere Events aggregieren
function aggregateAllergens(eventIds) {
  const perDish = [];
  const allSet = new Set();
  eventIds.forEach(eid => {
    const ev = getEventById(eid);
    if (!ev) return;
    (ev.dishes||[]).forEach(dish => {
      const recipe = getRecipeById(dish.recipeId);
      if (!recipe) return;
      const dishSet = new Set();
      recipe.ingredients.forEach(ing => {
        (ing.allergens || '').split(',').map(a => a.trim()).filter(Boolean).forEach(a => { dishSet.add(a); allSet.add(a); });
      });
      perDish.push({ recipeName: recipe.name, stationLabel: dish.stationLabel, allergens: Array.from(dishSet).sort((a,b)=>a.localeCompare(b,'de')) });
    });
  });
  return { perDish, allAllergens: Array.from(allSet).sort((a,b)=>a.localeCompare(b,'de')) };
}

// Wird aufgerufen, wenn im Küchenbriefing eine Menge/Portion direkt geändert wird.
// Fragt ab, ob die Änderung nur für dieses eine Event gelten soll oder dauerhaft als neuer
// Rezept-Standard. Bei "dauerhaft" werden alle bereits VERGANGENEN Events, die dasselbe
// Rezept nutzen, auf ihren bisherigen Wert eingefroren (Override), damit sich an ihrer
// Küchenbriefing-Anzeige nachträglich nichts ändert. Zukünftige/bestehende kommende Events
// übernehmen bewusst den neuen Standard, da der Zweck meist eine Korrektur ist.
function onIngredientQtyChange(eventId, dishId, recipeId, ingName, valueStr) {
  const newQty = valueStr.trim() === '' ? null : Number(valueStr);
  if (valueStr.trim() !== '' && isNaN(newQty)) {
    alert('Bitte eine gültige Zahl eingeben.');
    route();
    return;
  }
  const forever = confirm(
    'Menge/Portion für "' + ingName + '" ändern.\n\n' +
    'OK = dauerhaft als neuer Standard in diesem Rezept übernehmen (gilt für zukünftige Verwendungen; bereits vergangene Events bleiben unverändert)\n' +
    'Abbrechen = nur für dieses eine Event ändern'
  );
  const events = getEvents();
  const ev = events.find(e => e.id === eventId);
  const dish = ev && (ev.dishes || []).find(d => d.id === dishId);
  if (!dish) return;

  if (forever) {
    const today = todayStr();
    const recipes = getRecipes();
    const recipe = recipes.find(r => r.id === recipeId);
    const ing = recipe && recipe.ingredients.find(i => i.name === ingName);
    const oldQty = ing ? ing.qtyPerPortion : null;

    // Vergangene Events mit diesem Rezept auf ihren bisherigen Wert einfrieren,
    // sofern dort noch kein eigener Override gesetzt ist.
    events.forEach(e => {
      if (e.date >= today) return;
      (e.dishes || []).forEach(d => {
        if (d.recipeId !== recipeId) return;
        d.ingredientOverrides = d.ingredientOverrides || {};
        if (!Object.prototype.hasOwnProperty.call(d.ingredientOverrides, ingName)) {
          d.ingredientOverrides[ingName] = oldQty;
        }
      });
    });

    if (ing) ing.qtyPerPortion = newQty;
    if (dish.ingredientOverrides) delete dish.ingredientOverrides[ingName];

    saveRecipes(recipes);
    saveEvents(events);
  } else {
    dish.ingredientOverrides = dish.ingredientOverrides || {};
    dish.ingredientOverrides[ingName] = newQty;
    saveEvents(events);
  }
  route();
}

// Events optional nach Datum eingrenzen (start/end jeweils optional, YYYY-MM-DD)
function filterEventsByRange(events, start, end) {
  return events.filter(e => (!start || e.date >= start) && (!end || e.date <= end));
}

// Zutatenmengen mehrerer Gerichte (dishes) aufsummieren (berücksichtigt Varianten-Verteilung
// korrekt, statt einfach mit der Gesamt-Portionenzahl zu multiplizieren)
function sumIngredientsForDishes(dishes) {
  const totalsByIng = new Map(); // name||unit -> {qty, allergens, supplier}
  dishes.forEach(dish => {
    const scaled = computeScaledIngredients(dish);
    scaled.ingredients.forEach(ing => {
      const key = ing.name + '||' + (ing.unit || '');
      if (!totalsByIng.has(key)) {
        totalsByIng.set(key, { name: ing.name, unit: ing.unit, allergens: ing.allergens, supplier: ing.supplier, qty: 0, anyNull: false });
      }
      const entry = totalsByIng.get(key);
      if (ing.totalQty === null) entry.anyNull = true;
      else entry.qty += ing.totalQty;
    });
  });
  return Array.from(totalsByIng.values()).map(e => ({
    name: e.name, unit: e.unit, allergens: e.allergens, supplier: e.supplier,
    totalQty: e.anyNull ? null : fmtNum(e.qty)
  }));
}

// Produktionsgruppen (nach Rezept) für eine beliebige Menge von Event-IDs bilden.
// Wird von Tages-Kochplan, "bestimmte Events im Zeitraum" und generell überall dort
// genutzt, wo mehrere Events zusammengefasst nach Rezept dargestellt werden sollen.
function buildProductionGroups(eventIds) {
  const events = eventIds.map(getEventById).filter(Boolean);
  const grouped = new Map(); // recipeId -> { recipeName, totalPortions, events: [], dishes: [], dishRefs: [] }
  events.forEach(ev => {
    (ev.dishes||[]).forEach(dish => {
      const recipe = getRecipeById(dish.recipeId);
      if (!recipe) return;
      if (!grouped.has(dish.recipeId)) {
        grouped.set(dish.recipeId, { recipeId: dish.recipeId, recipeName: recipe.name, totalPortions: 0, events: [], dishes: [], dishRefs: [] });
      }
      const g = grouped.get(dish.recipeId);
      g.totalPortions += (dish.portions || 0);
      g.events.push({ eventName: ev.name, eventId: ev.id, departureTime: ev.departureTime, stationLabel: dish.stationLabel, serviceType: dish.serviceType, portions: dish.portions });
      g.dishes.push(dish);
      g.dishRefs.push({ eventId: ev.id, dishId: dish.id });
    });
  });
  return Array.from(grouped.values()).map(g => ({
    recipeId: g.recipeId, recipeName: g.recipeName, totalPortions: g.totalPortions,
    events: g.events, dishes: g.dishes, dishRefs: g.dishRefs,
    ingredients: sumIngredientsForDishes(g.dishes)
  }));
}

// Produktionsgruppe für EIN bestimmtes Rezept über eine beliebige Menge von Event-IDs
// (z.B. alle Events, optional nach Zeitraum gefiltert) – Basis für die "nach Rezept"-Ansicht.
function buildProductionGroupForRecipe(recipeId, eventIds) {
  const recipe = getRecipeById(recipeId);
  if (!recipe) return null;
  const events = eventIds.map(getEventById).filter(Boolean);
  const evEntries = [], dishes = [], dishRefs = [];
  let totalPortions = 0;
  events.forEach(ev => {
    (ev.dishes||[]).forEach(dish => {
      if (dish.recipeId !== recipeId) return;
      totalPortions += (dish.portions || 0);
      evEntries.push({ eventName: ev.name, eventId: ev.id, departureTime: ev.departureTime, stationLabel: dish.stationLabel, serviceType: dish.serviceType, portions: dish.portions });
      dishes.push(dish);
      dishRefs.push({ eventId: ev.id, dishId: dish.id });
    });
  });
  return { recipeId, recipeName: recipe.name, totalPortions, events: evEntries, dishes, dishRefs, ingredients: sumIngredientsForDishes(dishes) };
}

// Tagesplan: alle Events eines Datums, nach Rezept gruppiert und Portionen summiert
function computeDayPlan(dateStr) {
  const events = getEvents().filter(e => e.date === dateStr).sort((a,b) => (a.departureTime||'').localeCompare(b.departureTime||''));
  const groups = buildProductionGroups(events.map(e => e.id));
  return { events, groups };
}

// =========================================================================
// "Bestellt"-Status: pro Gericht (dish) gespeichertes Flag (dish.ordered).
// Überschriften/Zeilen in Produktions- und Bestelllisten bekommen dadurch eine
// Checkbox; ist sie gesetzt, wird der Hintergrund grün. Ein Event bzw. eine
// Rezept-Gruppe gilt als "bestellt", wenn ALLE zugehörigen Gerichte markiert sind.
// =========================================================================
function isEventFullyOrdered(ev) {
  return !!(ev && ev.dishes && ev.dishes.length && ev.dishes.every(d => d.ordered));
}
function isDishRefGroupOrdered(dishRefs) {
  return !!(dishRefs && dishRefs.length && dishRefs.every(r => {
    const ev = getEventById(r.eventId);
    const d = ev && (ev.dishes||[]).find(x => x.id === r.dishId);
    return d && d.ordered;
  }));
}
function dishRefsToStr(dishRefs) {
  return dishRefs.map(r => r.eventId + ':' + r.dishId).join(',');
}
function toggleDishOrdered(eventId, dishId, checked) {
  const events = getEvents();
  const ev = events.find(e => e.id === eventId);
  const dish = ev && (ev.dishes||[]).find(d => d.id === dishId);
  if (!dish) return;
  dish.ordered = checked;
  saveEvents(events);
  route();
}
function toggleEventOrdered(eventId, checked) {
  const events = getEvents();
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  (ev.dishes||[]).forEach(d => { d.ordered = checked; });
  saveEvents(events);
  route();
}
function toggleGroupOrdered(pairsStr, checked) {
  const pairs = pairsStr.split(',').filter(Boolean).map(p => p.split(':'));
  const events = getEvents();
  pairs.forEach(([eid, did]) => {
    const ev = events.find(e => e.id === eid);
    const dish = ev && (ev.dishes||[]).find(d => d.id === did);
    if (dish) dish.ordered = checked;
  });
  saveEvents(events);
  route();
}

// =========================================================================
// Export / Import (Backup & Teilen mit Mitarbeitern)
// =========================================================================
function exportData() {
  const payload = { recipes: getRecipes(), events: getEvents(), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'foodtruck-daten-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importDataFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      if (!confirm('Achtung: Dies überschreibt die GEMEINSAME Datenbank für ALLE Mitarbeiter mit dem Inhalt dieser Datei. Fortfahren?')) return;
      if (payload.recipes) saveRecipes(payload.recipes);
      if (payload.events) saveEvents(payload.events);
      alert('Import erfolgreich.');
      route();
    } catch (e) {
      alert('Fehler beim Import: ' + e.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// Event duplizieren: legt eine Kopie mit neuer ID an (inkl. neuer Dish-IDs) und
// springt direkt ins Bearbeitungsformular, damit nur noch Datum/Details angepasst werden müssen.
function duplicateEvent(id) {
  const ev = getEventById(id);
  if (!ev) return;
  const copy = JSON.parse(JSON.stringify(ev));
  copy.id = uid();
  copy.name = ev.name + ' (Kopie)';
  (copy.dishes || []).forEach(d => { d.id = uid(); });
  const events = getEvents();
  events.push(copy);
  saveEvents(events);
  location.hash = '#/events/' + copy.id + '/edit';
}
function deleteRecipe(id) {
  const inUse = getEvents().some(e => (e.dishes||[]).some(d => d.recipeId === id));
  if (inUse) { alert('Dieses Rezept wird noch in mindestens einem Event verwendet und kann nicht gelöscht werden.'); return; }
  if (!confirm('Rezept wirklich löschen?')) return;

// Formular-Handling: Events
// =========================================================================
// Baut die HTML-Eingabefelder für die Verteilung von Varianten-Zutaten (z.B. Protein-Auswahl) eines Rezepts.
// Gibt '' zurück, wenn das Rezept keine Variantengruppen hat.
function renderVariantBlockHtml(recipeId, variantSplits) {
  const recipe = getRecipeById(recipeId);
  if (!recipe) return '';
  const groups = getVariantGroups(recipe);
  const groupNames = Object.keys(groups);
  if (!groupNames.length) return '';
  return groupNames.map(gname => {
    const inputs = groups[gname].map(iname => {
      const val = (variantSplits && variantSplits[gname] && variantSplits[gname][iname] !== undefined) ? variantSplits[gname][iname] : '';
      return `<div class="field" style="margin-bottom:0;"><label>${esc(iname)}</label><input type="number" min="0" data-variant-group="${esc(gname)}" data-variant-name="${esc(iname)}" class="variant-input" value="${val}"></div>`;
    }).join('');
    return `<div class="variant-group-block"><div class="muted" style="margin-bottom:4px;">Verteilung "${esc(gname)}" – wie viele Portionen von jeder Variante? (Summe sollte der Portionenzahl oben entsprechen)</div><div class="row-auto">${inputs}</div></div>`;
  }).join('');
}

function onDishRecipeChange(selectEl) {

function addDishRow(recipeId, serviceType, stationLabel, portions, variantSplits) {

  const serviceOptionsHtml = Object.entries(SERVICE_TYPE_LABELS).map(([k, l]) => `<option value="${k}" ${k === serviceType ? 'selected' : ''}>${l}</option>`).join('');
  const row = document.createElement('div');
  row.className = 'dish-row';
  row.innerHTML = `
    <div class="dish-row-grid">
      <div class="field" style="margin-bottom:0;"><label>Rezept / Menü</label>
        <select name="dishRecipeId" onchange="onDishRecipeChange(this)"><option value="">-- wählen --</option>${optionsHtml}</select></div>
      <div class="field" style="margin-bottom:0;"><label>Ausgabeform</label>
        <select name="dishServiceType">${serviceOptionsHtml}</select></div>

function submitEventForm(ev, id) {
  ev.preventDefault();
  const form = ev.target;
  const data = {
    id: id || uid(),
    name: form.eventName.value.trim() || 'Unbenanntes Event',
    date: form.eventDate.value,
    departureTime: form.departureTime.value,
    location: form.eventLocation.value,
    notes: form.eventNotes.value,
    fleischCount: parseInt(form.fleischCount.value || 0, 10),
    vegetarischCount: parseInt(form.vegetarischCount.value || 0, 10),
    veganCount: parseInt(form.veganCount.value || 0, 10),
    sonstigeLabel: form.sonstigeLabel.value,
    sonstigeCount: parseInt(form.sonstigeCount.value || 0, 10),
    dishes: []
  };
  form.querySelectorAll('.dish-row').forEach(row => {
    const recipeId = row.querySelector('[name=dishRecipeId]').value;
    if (!recipeId) return;
    const variantSplits = {};
    row.querySelectorAll('.variant-input').forEach(inp => {
      if (inp.value === '') return;
      const g = inp.dataset.variantGroup, n = inp.dataset.variantName;
      variantSplits[g] = variantSplits[g] || {};
      variantSplits[g][n] = Number(inp.value);
    });
    data.dishes.push({
      id: uid(),
      recipeId,
      serviceType: row.querySelector('[name=dishServiceType]').value,
      stationLabel: row.querySelector('[name=dishStationLabel]').value,
      portions: parseInt(row.querySelector('[name=dishPortions]').value || 0, 10),
      variantSplits
    });
  });
  const events = getEvents();
  const idx = events.findIndex(e => e.id === data.id);
  if (idx >= 0) events[idx] = data; else events.push(data);
  saveEvents(events);
  location.hash = '#/events/' + data.id;
  return false;
}

// =========================================================================
// Formular-Handling: Rezepte
// =========================================================================
function addIngRow(name, qty, unit, allergens, supplier, container, tool, variantGroup) {
  const list = document.getElementById('ing-list');
  const row = document.createElement('div');
  row.className = 'ing-row';
  row.innerHTML = `
    <div class="ing-row-grid">
      <div class="field" style="margin-bottom:0;"><label>Zutat</label><input type="text" name="ingName" value="${esc(name||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Menge/Port.</label><input type="number" step="0.001" name="ingQty" value="${(qty===null||qty===undefined)?'':qty}"></div>
      <div class="field" style="margin-bottom:0;"><label>Einheit</label><input type="text" name="ingUnit" value="${esc(unit||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Allergene</label><input type="text" name="ingAllergens" value="${esc(allergens||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Lieferant</label><input type="text" name="ingSupplier" value="${esc(supplier||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Behälter</label><input type="text" name="ingContainer" value="${esc(container||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Vorleger</label><input type="text" name="ingTool" value="${esc(tool||'')}"></div>
      <div class="field" style="margin-bottom:0;"><label>Variantengruppe</label><input type="text" name="ingVariantGroup" placeholder="z.B. Protein" value="${esc(variantGroup||'')}"></div>
      <button type="button" class="remove-btn" onclick="this.closest('.ing-row').remove()">✕</button>
    </div>`;
  list.appendChild(row);
}

function submitRecipeForm(ev, id) {
  ev.preventDefault();
  const form = ev.target;
  const data = {
    id: id || uid(),
    name: form.recipeName.value.trim() || 'Unbenanntes Rezept',
    description: form.recipeDescription.value,
    defaultServiceType: form.recipeDefaultServiceType.value,
    needsReview: form.recipeNeedsReview.checked,
    ingredients: []
  };
  form.querySelectorAll('.ing-row').forEach(row => {
    const name = row.querySelector('[name=ingName]').value.trim();
    if (!name) return;
    const qtyRaw = row.querySelector('[name=ingQty]').value;
    data.ingredients.push({
      id: uid(),
      name,
      qtyPerPortion: qtyRaw === '' ? null : Number(qtyRaw),
      unit: row.querySelector('[name=ingUnit]').value,
      allergens: row.querySelector('[name=ingAllergens]').value,
      supplier: row.querySelector('[name=ingSupplier]').value,
      container: row.querySelector('[name=ingContainer]').value,
      tool: row.querySelector('[name=ingTool]').value,
      variantGroup: row.querySelector('[name=ingVariantGroup]').value.trim()
    });
  });
  const recipes = getRecipes();
  const idx = recipes.findIndex(r => r.id === data.id);
  if (idx >= 0) recipes[idx] = data; else recipes.push(data);
  saveRecipes(recipes);
  location.hash = '#/recipes/' + data.id;
  return false;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function viewDashboard() {
  const today = todayStr();
  const events = getEvents();
  const upcoming = events.filter(e => e.date >= today).sort((a,b) => a.date.localeCompare(b.date) || (a.departureTime||'').localeCompare(b.departureTime||''));
  const past = events.filter(e => e.date < today).sort((a,b) => b.date.localeCompare(a.date));

  const rowHtml = (ev, secondary) => `
    <div class="card card-row">
      <div>
        <strong>${esc(ev.name)}</strong> – ${esc(ev.date)}${ev.departureTime ? ' · Abfahrt ' + esc(ev.departureTime) : ''}
        <div class="muted">Gäste gesamt: ${eventGuestTotal(ev)} (Fleisch ${ev.fleischCount||0} / Vegetarisch ${ev.vegetarischCount||0} / Vegan ${ev.veganCount||0}${ev.sonstigeCount ? ' / ' + esc(ev.sonstigeLabel||'Sonstige') + ' ' + ev.sonstigeCount : ''})</div>
      </div>
      <div><a class="btn btn-small ${secondary?'btn-secondary':''}" href="#/events/${ev.id}">Öffnen</a></div>
    </div>`;

  return `
    <h1>Events</h1>
    <div class="card no-print">
      <form onsubmit="event.preventDefault(); location.hash='#/day-plan?date=' + this.d.value;" style="display:flex; gap:10px; align-items:end;">
        <div class="field" style="flex:1; margin-bottom:0;"><label>Tages-Kochplan für Datum ansehen</label><input type="date" name="d"></div>
        <button class="btn" type="submit">Kochplan öffnen</button>
      </form>
    </div>
    <h2>Kommende Events</h2>
    ${upcoming.length ? upcoming.map(ev => rowHtml(ev, false)).join('') : '<p class="muted">Keine kommenden Events. <a href="#/events/new">Jetzt Event anlegen</a>.</p>'}
    <h2>Vergangene Events</h2>
    ${past.length ? past.map(ev => rowHtml(ev, true)).join('') : '<p class="muted">Keine vergangenen Events.</p>'}
  `;
}

  return `
    <h1>${ev ? 'Event bearbeiten: ' + esc(ev.name) : 'Neues Event anlegen'}</h1>

        </div>

function viewEventDetail(id) {
  const ev = getEventById(id);
  if (!ev) return notFound('Event nicht gefunden.', '#/');

    const recipe = getRecipeById(d.recipeId);
    const variantGroups = recipe ? getVariantGroups(recipe) : {};
    const splitText = Object.keys(variantGroups).map(gname =>
      variantGroups[gname].map(n => `${esc(n)}: ${(d.variantSplits && d.variantSplits[gname] && d.variantSplits[gname][n]) || 0}`).join(' / ')
    ).join(' · ');
    return `<tr>
      <td>${esc(recipe ? recipe.name : '(gelöschtes Rezept)')}${recipe && recipe.needsReview ? ' <span class="badge badge-review">⚠ Mengen prüfen</span>' : ''}</td>
      <td><span class="badge badge-${d.serviceType}">${SERVICE_TYPE_LABELS[d.serviceType] || d.serviceType}</span></td>
      <td>${esc(d.stationLabel||'-')}</td>
      <td>${d.portions}${splitText ? '<br><span class="muted">'+splitText+'</span>' : ''}</td>
    </tr>`;
  }).join('');
  return `
    <h1>${esc(ev.name)}</h1>
    <p class="muted">${esc(ev.date)}${ev.departureTime ? ' · Abfahrt ' + esc(ev.departureTime) : ''}${ev.location ? ' · ' + esc(ev.location) : ''}</p>
    ${ev.notes ? '<p>' + esc(ev.notes) + '</p>' : ''}
    <div class="card">
      <h3>Personenanzahl</h3>
      <p>Fleischessende: <strong>${ev.fleischCount||0}</strong> ·

         Vegan: <strong>${ev.veganCount||0}</strong>
         ${ev.sonstigeCount ? ' · ' + esc(ev.sonstigeLabel||'Sonstige') + ': <strong>' + ev.sonstigeCount + '</strong>' : ''}

    <div class="card">
      <h3 class="${isEventFullyOrdered(ev) ? 'ordered-heading' : ''}"><label class="ordered-check no-print-input"><input type="checkbox" ${isEventFullyOrdered(ev) ? 'checked' : ''} onchange="toggleEventOrdered('${ev.id}', this.checked)"></label>Menü <span class="muted" style="font-weight:400;">(Haken = alles für dieses Event bestellt)</span></h3>
      ${ev.dishes && ev.dishes.length ? `<table><tr><th>Gericht</th><th>Ausgabeform</th><th>Station</th><th>Portionen</th></tr>${dishRows}</table>` : '<p class="muted">Noch keine Gerichte zugeordnet.</p>'}
    </div>
    <div class="no-print">
      <a class="btn" href="#/events/${ev.id}/briefing">Küchenbriefing</a>
      <a class="btn" href="#/events/${ev.id}/allergens">Allergenliste</a>
      <a class="btn" href="#/events/${ev.id}/orders">Bestellliste</a>
      <a class="btn btn-secondary" href="#/events/${ev.id}/edit">Bearbeiten</a>
      <button class="btn btn-secondary" onclick="duplicateEvent('${ev.id}')">Duplizieren</button>
      <button class="btn btn-danger" onclick="deleteEvent('${ev.id}')">Löschen</button>
    </div>
  `;
}

function viewKitchenBriefing(id) {
  const ev = getEventById(id);
  if (!ev) return notFound('Event nicht gefunden.', '#/');
  const blocks = (ev.dishes||[]).map(d => {
    const { recipe, ingredients } = computeScaledIngredients(d);
    if (!recipe) return '';
    const rows = ingredients.map(ing => `<tr>
      <td>${esc(ing.name)}${ing.variantGroup ? ' <span class="badge">'+esc(ing.variantGroup)+'</span>' : ''}${ing.isOverridden ? ' <span class="badge" title="Für dieses Event angepasst">angepasst</span>' : ''}</td>
      <td class="no-print-input">
        <input type="number" step="0.001" min="0" value="${ing.qtyPerPortion !== null ? ing.qtyPerPortion : ''}" style="width:90px; display:inline-block;"
               onchange="onIngredientQtyChange('${ev.id}', '${d.id}', '${recipe.id}', '${esc(ing.name).replace(/'/g, "\\'")}', this.value)">
        <span class="muted">${esc(ing.unit||'')}</span>
        <span class="print-only-value">${ing.qtyPerPortion !== null ? ing.qtyPerPortion + ' ' + esc(ing.unit||'') : '?'}</span>
      </td>
      <td>${ing.totalQty !== null ? '<strong>' + ing.totalQty + ' ' + esc(ing.unit||'') + '</strong>' : '<span class="muted">bitte prüfen</span>'}${ing.variantGroup ? ' <span class="muted">(' + ing.portionsUsed + ' Port.)</span>' : ''}</td>
      <td>${esc(ing.allergens||'')}</td>
      <td>${esc(ing.supplier||'')}</td>
      <td>${esc(ing.container||'')}</td>
      <td>${esc(ing.tool||'')}</td>
    </tr>`).join('');
    const variantGroups = getVariantGroups(recipe);
    const splitSummary = Object.keys(variantGroups).map(gname => {
      const parts = variantGroups[gname].map(n => `${esc(n)}: ${(d.variantSplits && d.variantSplits[gname] && d.variantSplits[gname][n]) || 0}`).join(' / ');
      return `${esc(gname)} – ${parts}`;
    }).join(' · ');
    return `
      <div class="card">
        <h2 class="${d.ordered ? 'ordered-heading' : ''}"><label class="ordered-check no-print-input" title="Alle Produkte für dieses Gericht bestellt"><input type="checkbox" ${d.ordered ? 'checked' : ''} onchange="toggleDishOrdered('${ev.id}', '${d.id}', this.checked)"></label>${esc(recipe.name)} <span class="badge badge-${d.serviceType}">${SERVICE_TYPE_LABELS[d.serviceType]||d.serviceType}</span>${d.stationLabel ? ' <span class="badge">'+esc(d.stationLabel)+'</span>' : ''}</h2>
        <p><strong>${d.portions} Portionen</strong>${splitSummary ? ' · ' + splitSummary : ''}</p>
        ${recipe.needsReview ? `<div class="warning-box">⚠ Die Mengenangaben dieses Rezepts sind noch nicht final geprüft. Bitte im <a href="#/recipes/${recipe.id}/edit">Rezept bearbeiten</a> ergänzen/kontrollieren.</div>` : ''}
        <table><tr><th>Zutat</th><th>Menge/Portion</th><th>Gesamtmenge</th><th>Allergene</th><th>Lieferant</th><th>Behälter</th><th>Vorleger</th></tr>${rows}</table>
      </div>`;
  }).join('');
  return `
    <h1>Küchenbriefing: ${esc(ev.name)}</h1>
    <p>${esc(ev.date)}${ev.departureTime ? ' · Abfahrt ' + esc(ev.departureTime) : ''} · Gäste gesamt: ${eventGuestTotal(ev)}
       (Fleisch ${ev.fleischCount||0} / Vegetarisch ${ev.vegetarischCount||0} / Vegan ${ev.veganCount||0}${ev.sonstigeCount ? ' / ' + esc(ev.sonstigeLabel||'Sonstige') + ' ' + ev.sonstigeCount : ''})</p>
    <div class="no-print" style="margin-bottom:14px;">
      <button class="btn" onclick="window.print()">Drucken</button>
      <a class="btn btn-secondary" href="#/events/${ev.id}">Zurück zum Event</a>
    </div>
    ${blocks}
  `;
}

// Wiederverwendbarer Inhalt einer Bestellliste (ohne Titel/Drucken-Button), damit er
// sowohl in der klassischen Bestellliste als auch im Bestellliste-Hub (nach Rezept /
// bestimmte Events im Zeitraum) genutzt werden kann. opts.recipeId (optional) grenzt
// die Zutaten auf ein bestimmtes Rezept ein.
function renderOrderListBody(eventIds, opts) {
  opts = opts || {};
  const { rows, unresolved } = aggregateOrderList(eventIds, opts.recipeId || null);
  const events = eventIds.map(getEventById).filter(Boolean);
  const recipeMap = new Map(); // recipeId -> { recipeName, dishRefs: [] }
  events.forEach(ev => {
    (ev.dishes||[]).forEach(d => {
      if (opts.recipeId && d.recipeId !== opts.recipeId) return;
      const recipe = getRecipeById(d.recipeId);
      if (!recipe) return;
      if (!recipeMap.has(d.recipeId)) recipeMap.set(d.recipeId, { recipeName: recipe.name, dishRefs: [] });
      recipeMap.get(d.recipeId).dishRefs.push({ eventId: ev.id, dishId: d.id });
    });
  });
  const eventItems = events.map(e => {
    const ordered = isEventFullyOrdered(e);
    return `<li class="${ordered ? 'ordered-heading' : ''}"><label class="ordered-check no-print-input" title="Alles für dieses Event bestellt"><input type="checkbox" ${ordered ? 'checked' : ''} onchange="toggleEventOrdered('${e.id}', this.checked)"></label>${esc(e.name)} – ${esc(e.date)}</li>`;
  }).join('');
  const recipeItems = Array.from(recipeMap.entries()).map(([rid, info]) => {
    const pairsStr = dishRefsToStr(info.dishRefs);
    const ordered = isDishRefGroupOrdered(info.dishRefs);
    return `<li class="${ordered ? 'ordered-heading' : ''}"><label class="ordered-check no-print-input" title="Alles für dieses Rezept bestellt"><input type="checkbox" ${ordered ? 'checked' : ''} onchange="toggleGroupOrdered('${pairsStr}', this.checked)"></label>${esc(info.recipeName)}</li>`;
  }).join('');
  return `
    ${events.length ? `<div class="card"><h3>Enthaltene Events</h3><ul>${eventItems}</ul></div>` : ''}
    ${recipeItems ? `<div class="card"><h3>Enthaltene Rezepte</h3><ul>${recipeItems}</ul></div>` : ''}
    <div class="card">
      <h3>Zutaten gesamt</h3>
      ${rows.length ? `<table><tr><th>Zutat</th><th>Menge</th><th>Einheit</th></tr>${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.qty}</td><td>${esc(r.unit)}</td></tr>`).join('')}</table>` : '<p class="muted">Keine Zutaten mit bekannter Menge/Portion gefunden.</p>'}
    </div>
    ${unresolved.length ? `<div class="warning-box"><strong>⚠ ${unresolved.length} Zutat(en) ohne bekannte Menge pro Portion</strong> – nicht in der Summe oben enthalten. Bitte in den Rezepten ergänzen: <ul>${unresolved.map(u => `<li>${esc(u.name)} (${esc(u.recipe)})</li>`).join('')}</ul></div>` : ''}
  `;
}

// Eine Produktionsgruppe (ein Rezept, ggf. über mehrere Events summiert) als Karte
// rendern – inkl. "bestellt"-Checkbox, die alle beitragenden Gerichte auf einmal markiert.

  const pairsStr = dishRefsToStr(g.dishRefs);
  const ordered = isDishRefGroupOrdered(g.dishRefs);
  return `
    <div class="card">
      <h3 class="${ordered ? 'ordered-heading' : ''}"><label class="ordered-check no-print-input" title="Alles für dieses Rezept bestellt"><input type="checkbox" ${ordered ? 'checked' : ''} onchange="toggleGroupOrdered('${pairsStr}', this.checked)"></label>${esc(g.recipeName)} – gesamt ${g.totalPortions} Portionen</h3>
      <table><tr><th>Verwendet in</th><th>Abfahrt</th><th>Station</th><th>Ausgabeform</th><th>Portionen</th></tr>
      ${g.events.map(e => `<tr><td>${esc(e.eventName)}</td><td>${esc(e.departureTime||'-')}</td><td>${esc(e.stationLabel||'-')}</td><td><span class="badge badge-${e.serviceType}">${SERVICE_TYPE_LABELS[e.serviceType]||e.serviceType}</span></td><td>${e.portions}</td></tr>`).join('')}
      </table>
      <table><tr><th>Zutat</th><th>Gesamtmenge (alle Events)</th><th>Allergene</th><th>Lieferant</th></tr>
      ${g.ingredients.map(ing => `<tr><td>${esc(ing.name)}</td><td>${ing.totalQty !== null ? '<strong>'+ing.totalQty+' '+esc(ing.unit||'')+'</strong>' : '<span class="muted">bitte prüfen</span>'}</td><td>${esc(ing.allergens||'')}</td><td>${esc(ing.supplier||'')}</td></tr>`).join('')}
      </table>
    </div>`;
}

    <div class="card no-print">
      <form onsubmit="event.preventDefault(); location.hash='#/day-plan?date=' + this.d.value;" style="display:flex; gap:10px; align-items:end;">
        <div class="field" style="margin-bottom:0;"><label>Datum wählen</label><input type="date" name="d" value="${esc(dateStr)}"></div>
        <button class="btn" type="submit">Anzeigen</button>
      </form>
    </div>
    <div class="no-print" style="margin-bottom:14px;">
      <button class="btn" onclick="window.print()">Drucken</button>
      ${events.length ? `<a class="btn btn-secondary" href="#/orders?start=${esc(dateStr)}&end=${esc(dateStr)}">Bestellliste für diesen Tag</a>` : ''}
    </div>
    <div class="card">
      <h3>Events an diesem Tag</h3>
      ${events.length ? `<table><tr><th></th><th>Event</th><th>Abfahrt</th><th>Gäste gesamt</th></tr>${events.map(ev => `<tr class="${isEventFullyOrdered(ev) ? 'ordered-heading' : ''}"><td class="no-print-input"><input type="checkbox" ${isEventFullyOrdered(ev) ? 'checked' : ''} title="Alles für dieses Event bestellt" onchange="toggleEventOrdered('${ev.id}', this.checked)"></td><td><a href="#/events/${ev.id}">${esc(ev.name)}</a></td><td>${esc(ev.departureTime||'-')}</td><td>${eventGuestTotal(ev)}</td></tr>`).join('')}</table>` : '<p class="muted">Keine Events an diesem Datum.</p>'}
    </div>
    ${groups.length ? `
    <h2>Produktion nach Rezept zusammengefasst</h2>
    <p class="muted">Portionen mehrerer Events für dasselbe Gericht wurden addiert.</p>
    ${groups.map(renderProductionGroupCard).join('')}
    ` : ''}
  `;
}

// Gemeinsamer "Zeitraum wählen -> Events auswählen -> Liste erzeugen"-Baustein für den
// Modus "bestimmte Events in einem Zeitraum", genutzt sowohl von der Produktionsliste
// als auch von der Bestellliste (kind: 'production' | 'orders').
function renderRangePicker(kind, q) {
  const start = q.start || '', end = q.end || '';
  const hashBase = kind === 'production' ? '#/production?mode=range' : '#/orders?mode=range';
  let checklist = '', resultHtml = '';
  if (start && end) {
    const events = filterEventsByRange(getEvents(), start, end).sort((a,b) => a.date.localeCompare(b.date));
    if (q.events) {
      const ids = q.events.split(',').filter(Boolean);
      if (kind === 'production') {
        const groups = buildProductionGroups(ids);
        resultHtml = groups.length ? groups.map(renderProductionGroupCard).join('') : '<p class="muted">Keine Daten für die gewählten Events.</p>';
      } else {
        resultHtml = `<div class="no-print" style="margin-bottom:14px;"><button class="btn" onclick="window.print()">Drucken</button></div>` + renderOrderListBody(ids, {});
      }
    } else {
      checklist = `
        <div class="card no-print">
          <h3>Events im Zeitraum ${esc(start)} – ${esc(end)}</h3>
          ${events.length ? `
          <form onsubmit="event.preventDefault(); const ids=[...this.querySelectorAll('input[name=evsel]:checked')].map(c=>c.value); location.hash='${hashBase}&start=${esc(start)}&end=${esc(end)}&events='+ids.join(',');">
            ${events.map(e => `<div class="field-inline"><input type="checkbox" name="evsel" value="${e.id}" checked> <label style="margin:0;">${esc(e.name)} – ${esc(e.date)}</label></div>`).join('')}
            <button class="btn" type="submit" style="margin-top:10px;">Liste erzeugen</button>
          </form>` : '<p class="muted">Keine Events in diesem Zeitraum.</p>'}
        </div>`;
    }
  }
  return `
    <div class="card no-print">
      <form onsubmit="event.preventDefault(); location.hash='${hashBase}&start=' + this.s.value + '&end=' + this.e.value;" style="display:flex; gap:10px; align-items:end;">
        <div class="field" style="margin-bottom:0;"><label>Von</label><input type="date" name="s" value="${esc(start)}" required></div>
        <div class="field" style="margin-bottom:0;"><label>Bis</label><input type="date" name="e" value="${esc(end)}" required></div>
        <button class="btn" type="submit">Events anzeigen</button>
      </form>
    </div>
    ${checklist}
    ${resultHtml}
  `;
}

function viewProductionHub(q) {
  q = q || {};
  const mode = q.mode || '';
  let body = '';
  if (mode === 'recipe') {
    const recipes = getRecipes().slice().sort((a,b) => a.name.localeCompare(b.name, 'de'));
    const recipeOptions = recipes.map(r => `<option value="${r.id}" ${q.recipeId===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
    let resultHtml = '';
    if (q.recipeId) {
      const filtered = filterEventsByRange(getEvents(), q.start, q.end).filter(e => (e.dishes||[]).some(d => d.recipeId === q.recipeId));
      const g = buildProductionGroupForRecipe(q.recipeId, filtered.map(e => e.id));
      resultHtml = g && g.dishes.length ? renderProductionGroupCard(g) : '<p class="muted">Keine Verwendung dieses Rezepts im gewählten Zeitraum gefunden.</p>';
    }
    body = `
      <div class="card no-print">
        <form onsubmit="event.preventDefault(); location.hash='#/production?mode=recipe&recipeId='+this.r.value+'&start='+this.s.value+'&end='+this.e.value;" style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
          <div class="field" style="flex:1; min-width:200px; margin-bottom:0;"><label>Rezept</label><select name="r" required><option value="">-- wählen --</option>${recipeOptions}</select></div>
          <div class="field" style="margin-bottom:0;"><label>Von (optional)</label><input type="date" name="s" value="${esc(q.start||'')}"></div>
          <div class="field" style="margin-bottom:0;"><label>Bis (optional)</label><input type="date" name="e" value="${esc(q.end||'')}"></div>
          <button class="btn" type="submit">Anzeigen</button>
        </form>
      </div>
      ${resultHtml}
    `;
  } else if (mode === 'event') {
    const events = getEvents().slice().sort((a,b) => b.date.localeCompare(a.date));
    const options = events.map(e => `<option value="${e.id}">${esc(e.name)} – ${esc(e.date)}</option>`).join('');
    body = `
      <div class="card no-print">
        <form onsubmit="event.preventDefault(); location.hash='#/events/'+this.ev.value+'/briefing';" style="display:flex; gap:10px; align-items:end;">
          <div class="field" style="flex:1; margin-bottom:0;"><label>Event</label><select name="ev" required><option value="">-- wählen --</option>${options}</select></div>
          <button class="btn" type="submit">Küchenbriefing öffnen</button>
        </form>
      </div>
    `;
  } else if (mode === 'day') {
    body = `
      <div class="card no-print">
        <form onsubmit="event.preventDefault(); location.hash='#/day-plan?date='+this.d.value;" style="display:flex; gap:10px; align-items:end;">
          <div class="field" style="flex:1; margin-bottom:0;"><label>Datum</label><input type="date" name="d" required></div>
          <button class="btn" type="submit">Anzeigen</button>
        </form>
      </div>
    `;
  } else if (mode === 'range') {
    body = renderRangePicker('production', q);
  } else {
    body = `
      <div class="hub-cards">
        <div class="card"><h3>Nach Rezept</h3><p class="muted">Produktion für ein bestimmtes Rezept über einen Zeitraum (oder alle Zeit) zusammenfassen.</p><a class="btn" href="#/production?mode=recipe">Wählen</a></div>
        <div class="card"><h3>Ganzes Event</h3><p class="muted">Küchenbriefing für ein einzelnes Event.</p><a class="btn" href="#/production?mode=event">Wählen</a></div>
        <div class="card"><h3>Alle Events an einem Tag</h3><p class="muted">Tages-Kochplan: alle Events eines Datums zusammengefasst.</p><a class="btn" href="#/production?mode=day">Wählen</a></div>
        <div class="card"><h3>Bestimmte Events in einem Zeitraum</h3><p class="muted">Zeitraum wählen und einzelne Events daraus auswählen.</p><a class="btn" href="#/production?mode=range">Wählen</a></div>
      </div>
    `;
  }
  return `
    <h1>Produktionsliste</h1>
    ${mode ? '<p class="no-print"><a href="#/production">← Andere Auswahl</a></p>' : ''}
    ${body}
  `;
}

        <div class="card"><h3>Alle Events an einem Tag</h3><p class="muted">Alle Events eines Datums zusammengefasst bestellen.</p><a class="btn" href="#/orders?mode=day">Wählen</a></div>
        <div class="card"><h3>Bestimmte Events in einem Zeitraum</h3><p class="muted">Zeitraum wählen und einzelne Events daraus auswählen.</p><a class="btn" href="#/orders?mode=range">Wählen</a></div>

function viewRecipeList() {
  const recipes = getRecipes().slice().sort((a,b) => a.name.localeCompare(b.name, 'de'));
  return `
    <h1>Rezeptdatenbank</h1>
    <a class="btn" href="#/recipes/new">+ Neues Rezept</a>
    <div class="card" style="margin-top:14px;">
      <table><tr><th>Name</th><th>Standard-Ausgabeform</th><th>Status</th><th></th></tr>
      ${recipes.map(r => `<tr>
        <td><a href="#/recipes/${r.id}">${esc(r.name)}</a></td>
        <td>${SERVICE_TYPE_LABELS[r.defaultServiceType] || '-'}</td>
        <td>${r.needsReview ? '<span class="badge badge-review">⚠ Mengen prüfen</span>' : '<span class="badge badge-ok">geprüft</span>'}</td>
        <td><a class="btn btn-small btn-secondary" href="#/recipes/${r.id}/edit">Bearbeiten</a></td>
      </tr>`).join('')}
      </table>
    </div>
  `;
}

function viewRecipeForm(id) {
  const recipe = id ? getRecipeById(id) : null;
  if (id && !recipe) return notFound('Rezept nicht gefunden.', '#/recipes');
  const ingredients = recipe ? recipe.ingredients : [];
  setTimeout(() => {
    ingredients.forEach(i => addIngRow(i.name, i.qtyPerPortion, i.unit, i.allergens, i.supplier, i.container, i.tool, i.variantGroup));
  }, 0);
  const serviceOptions = Object.entries(SERVICE_TYPE_LABELS).map(([k,l]) => `<option value="${k}" ${recipe && recipe.defaultServiceType===k ? 'selected':''}>${l}</option>`).join('');
  return `
    <h1>${recipe ? 'Rezept bearbeiten: ' + esc(recipe.name) : 'Neues Rezept anlegen'}</h1>
    <form onsubmit="return submitRecipeForm(event, ${recipe ? "'"+recipe.id+"'" : 'null'})">
      <div class="card">
        <div class="row3">
          <div class="field"><label>Name</label><input type="text" name="recipeName" required value="${esc(recipe?recipe.name:'')}"></div>
          <div class="field"><label>Standard-Ausgabeform</label><select name="recipeDefaultServiceType"><option value="">-- keine --</option>${serviceOptions}</select></div>
          <div class="field-inline"><input type="checkbox" name="recipeNeedsReview" ${recipe && recipe.needsReview ? 'checked' : ''}> <label style="margin:0;">Mengen noch nicht final geprüft</label></div>
        </div>
        <div class="field"><label>Beschreibung</label><textarea name="recipeDescription" rows="2">${esc(recipe?recipe.description:'')}</textarea></div>
      </div>
      <div class="card">
        <h3>Zutaten</h3>
        <div id="ing-list"></div>
        <button type="button" class="btn btn-secondary btn-small" onclick="addIngRow()">+ Zutat hinzufügen</button>
      </div>
      <button class="btn" type="submit">Speichern</button>
      <a class="btn btn-secondary" href="#/recipes">Abbrechen</a>
    </form>
  `;
}

function viewRecipeDetail(id) {
  const recipe = getRecipeById(id);
  if (!recipe) return notFound('Rezept nicht gefunden.', '#/recipes');
  return `
    <h1>${esc(recipe.name)} ${recipe.needsReview ? '<span class="badge badge-review">⚠ Mengen prüfen</span>' : ''}</h1>
    ${recipe.description ? '<p>' + esc(recipe.description) + '</p>' : ''}
    <p class="muted">Standard-Ausgabeform: ${SERVICE_TYPE_LABELS[recipe.defaultServiceType] || '-'}</p>
    <div class="card">
      <table><tr><th>Zutat</th><th>Menge/Portion</th><th>Allergene</th><th>Lieferant</th><th>Behälter</th><th>Vorleger</th><th>Variantengruppe</th></tr>
      ${recipe.ingredients.map(ing => `<tr>
        <td>${esc(ing.name)}</td>
        <td>${ing.qtyPerPortion !== null && ing.qtyPerPortion !== undefined ? ing.qtyPerPortion + ' ' + esc(ing.unit||'') : '<span class="muted">unbekannt</span>'}</td>
        <td>${esc(ing.allergens||'')}</td><td>${esc(ing.supplier||'')}</td><td>${esc(ing.container||'')}</td><td>${esc(ing.tool||'')}</td><td>${esc(ing.variantGroup||'')}</td>
      </tr>`).join('')}
      </table>
    </div>
    <a class="btn" href="#/recipes/${recipe.id}/edit">Bearbeiten</a>
    <a class="btn btn-secondary" href="#/recipes">Zurück zur Übersicht</a>
    <button class="btn btn-danger" onclick="deleteRecipe('${recipe.id}')">Löschen</button>
  `;
}

function notFound(msg, backHref) {
  return `<div class="flash flash-error">${esc(msg)}</div><a class="btn" href="${backHref}">Zurück</a>`;
}

// =========================================================================
// Router
// =========================================================================
function parseQuery(qs) {
  const params = {};
  if (!qs) return params;
  qs.split('&').forEach(pair => {
    const [k, v] = pair.split('=');
    if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

function route() {
  const app = document.getElementById('app');
  if (_recipesCache === null || _eventsCache === null) {
    app.innerHTML = '<p class="muted">Lade Daten aus der gemeinsamen Datenbank…</p>';
    return;
  }
  const full = location.hash.slice(1) || '/';
  const [pathPart, qsPart] = full.split('?');
  const q = parseQuery(qsPart);
  let html = '';
  let m;
  if (pathPart === '/' || pathPart === '') html = viewDashboard();
  else if (pathPart === '/events/new') html = viewEventForm(null);
  else if ((m = pathPart.match(/^\/events\/([^\/]+)\/edit$/))) html = viewEventForm(m[1]);
  else if ((m = pathPart.match(/^\/events\/([^\/]+)\/briefing$/))) html = viewKitchenBriefing(m[1]);
  else if ((m = pathPart.match(/^\/events\/([^\/]+)\/allergens$/))) html = viewAllergenList(m[1]);
  else if ((m = pathPart.match(/^\/events\/([^\/]+)\/orders$/))) html = viewOrderList([m[1]], 'Bestellliste – ' + ((getEventById(m[1])||{}).name || ''), {});
  else if ((m = pathPart.match(/^\/events\/([^\/]+)$/))) html = viewEventDetail(m[1]);
  else if (pathPart === '/recipes') html = viewRecipeList();
  else if (pathPart === '/recipes/new') html = viewRecipeForm(null);
  else if ((m = pathPart.match(/^\/recipes\/([^\/]+)\/edit$/))) html = viewRecipeForm(m[1]);
  else if ((m = pathPart.match(/^\/recipes\/([^\/]+)$/))) html = viewRecipeDetail(m[1]);
  else if (pathPart === '/day-plan') html = viewDayPlan(q.date);
  else if (pathPart === '/production') html = viewProductionHub(q);
  else if (pathPart === '/orders') {
    if (q.mode) {
      html = viewOrdersHub(q);
    } else if (q.start && q.end) {
      const ids = getEvents().filter(e => e.date >= q.start && e.date <= q.end).map(e => e.id);
      html = viewOrderList(ids, 'Bestellliste ' + q.start + ' – ' + q.end, { isRangeForm: true, start: q.start, end: q.end });
    } else {
      html = viewOrdersHub(q);
    }
  }
  else html = viewDashboard();
  app.innerHTML = html;
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => { initFirebase(); route(); });
</script>
</body>
